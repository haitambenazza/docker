services:
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    image: mariadb:1.1
    restart: always
    env_file: .env
    secrets: 
      - mariadb_secret_password 
      - root_mariadb_secret_password
    volumes: 
      - "/home/${USER}/data/mariadb:/var/lib/mysql"
    networks:
      my_network:
        aliases:
          - mariadb

