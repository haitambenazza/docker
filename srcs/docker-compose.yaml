services:
  mariadb:
    build: requirements/mariadb/.
    container_name: mariadb
    image: mariadb:1.1
    restart: always
    env_file: .env
    secrets: 
      - mariadb_secret_password 
      - root_mariadb_secret_password
    volumes: 
      - mariadb_vol:/var/lib/mysql
    networks:
      my_network:
        aliases:
          - mariadb
  
  wordpress:
    build: requirements/wordpress/.
    container_name: wordpress
    image: wordpress:1.1
    restart: always
    env_file: .env
    secrets: 
      - mariadb_secret_password 
      - root_wordpress_secret_password
      - wordpress_secret_password
    volumes: 
      - wordpress_vol:/var/www/html
    depends_on:
      - mariadb
    networks:
      my_network:
        aliases:
          - wordpress
  nginx:
    build: requirements/nginx/.
    container_name: nginx
    image: nginx:1.1
    restart: always
    env_file: .env
    ports:
      - 443:443
    depends_on:
      - wordpress
    volumes:
      - wordpress_vol:/var/www/html
    networks:
      my_network:
        aliases:
          - nginx

networks:
  my_network:
    name: inception
    driver: bridge

volumes:
  mariadb_vol:
    driver: local
    name: mariadb_vol
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/mariadb
  
  wordpress_vol:
    driver: local
    name: wordpress_vol
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/wordpress


secrets:
  mariadb_secret_password:
    file: ./../secrets/db_password.txt
  root_mariadb_secret_password:
    file: ./../secrets/db_root_password.txt
  wordpress_secret_password:
    file : ./../secrets/wordpress_passwd.txt
  root_wordpress_secret_password:
    file : ./../secrets/root_wd_passwd.txt
